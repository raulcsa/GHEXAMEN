name: Reusable Build

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "The directory where the component source code is located"
      component-name:
        required: true
        type: string
        description: "Display name of the component"
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: "Whether to upload build artifacts"
    outputs:
      artifact-name:
        description: "The name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.component-name }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact-name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ inputs.working-directory }}/package.json'

      - name: Install Dependencies
        run: npm install
        working-directory: ${{ inputs.working-directory }}

      - name: Run Build
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

      # Determine if there's a specific build output folder (like frontend/dist)
      - name: Check for build output
        id: check-dir
        run: |
          if [ -d "${{ inputs.working-directory }}/dist" ]; then
            echo "dir=${{ inputs.working-directory }}/dist" >> $GITHUB_OUTPUT
          else
            echo "dir=${{ inputs.working-directory }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Build Artifacts
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ inputs.component-name }}-${{ github.run_id }}
          path: ${{ steps.check-dir.outputs.dir }}
          retention-days: 5

      - name: Set Artifact Output
        id: set-output
        run: |
          echo "artifact-name=build-artifact-${{ inputs.component-name }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
