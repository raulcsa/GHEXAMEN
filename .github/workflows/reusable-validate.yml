name: Reusable Validate

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "The directory where the component source code is located"
      component-name:
        required: true
        type: string
        description: "Display name of the component"
      language:
        required: true
        type: string
        description: "The language type: 'node' or 'terraform'"

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.component-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node Component)
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ inputs.working-directory }}/package.json'

      - name: Install Dependencies (Node Component)
        if: inputs.language == 'node'
        run: npm install
        working-directory: ${{ inputs.working-directory }}

      - name: Run Node Linter (Node Component)
        if: inputs.language == 'node'
        run: npm run lint
        working-directory: ${{ inputs.working-directory }}

      - name: Make Validation Script Executable (Infrastructure Component)
        if: inputs.language == 'terraform'
        run: chmod +x ./validate.sh
        working-directory: ${{ inputs.working-directory }}

      - name: Run Infrastructure Validation (Infrastructure Component)
        if: inputs.language == 'terraform'
        run: ./validate.sh
        working-directory: ${{ inputs.working-directory }}
